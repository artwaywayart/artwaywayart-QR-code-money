  <script>
        // Elements
        const amountInput = document.getElementById('amount');
        const qrButton = document.getElementById('qrButton');
        const qrModal = document.getElementById('qrModal');
        const displayAmount = document.getElementById('displayAmount');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // Show QR Modal
        function showQRModal() {
            const amount = parseFloat(amountInput.value) || 0;
            
            if (amount <= 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'กรุณากรอกจำนวนเงิน',
                    text: 'กรุณากรอกจำนวนเงินที่ถูกต้องก่อนแสดง QR Code',
                    confirmButtonText: 'ตกลง',
                    confirmButtonColor: '#2b9348'
                });
                return;
            }

            displayAmount.textContent = Math.floor(amount).toLocaleString('th-TH') + ' บาท';
            
            qrModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Close QR Modal
        function closeQRModal() {
            qrModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Show Loading
        function showLoading() {
            loadingOverlay.classList.remove('hidden');
        }

        // Hide Loading
        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }



        // Event Listeners
        qrButton.addEventListener('click', showQRModal);
        


        // Close modal on Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeQRModal();
            }
        });

        // Format number input
        amountInput.addEventListener('input', function() {
            const value = this.value;
            if (value && !isNaN(value)) {
                const numValue = parseFloat(value);
                if (numValue < 0) {
                    this.value = 0;
                }
            }
        });
    </script>
